services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel run
    # Ensure it is on the same network as the service you want to expose
    networks:
      - tunnel-net

networks:
  tunnel-net:
    name: tunnel-net
